<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Heroes Academy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Main Clock Widget */
    .main-widget {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 16px 0;
      flex-wrap: wrap;
    }
    .ring-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      transform: rotate(-90deg);
      width: 150px;
      height: 150px;
    }
    circle { fill: none; stroke-width: 8; }
    .bg-circle { stroke: #222222; }
    .progress-circle {
      stroke: #f5a623;
      stroke-linecap: round;
      stroke-dasharray: 377;
      stroke-dashoffset: 377;
      transition: stroke-dashoffset 0.5s ease;
    }
    .inner-text {
      position: absolute;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pct-number { font-size: 42px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .phase-label { font-size: 10px; color: #888888; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px; font-weight: 600; }
    .time-label { font-size: 11px; color: #aaaaaa; margin-top: 2px; font-family: monospace; }

    .info-side {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
    }
    .sub-line {
      font-size: 13px;
      color: #888888;
      font-family: monospace;
    }
    .alarm-chip {
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #cccccc;
      width: fit-content;
      font-family: monospace;
    }
    .alarm-chip input[type="time"] {
      background: transparent;
      border: none;
      color: #cccccc;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    /* To Do List Section */
    .todo-section {
      background-color: #121214;
      border: 1px solid #1f1f23;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .todo-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .todo-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .todo-subtitle {
      font-size: 11px;
      font-weight: 700;
      color: #666666;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .todo-count {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
    }
    .todo-count span {
      font-size: 14px;
      color: #666666;
      font-weight: 600;
    }
    .streak-badge {
      background-color: #181510;
      border: 1px solid #3d2b0f;
      color: #f5a623;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #18181b;
      border: 1px solid #27272a;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
    }
    .todo-item.completed span {
      text-decoration: line-through;
      color: #666666;
    }
    .todo-item input[type="checkbox"] {
      accent-color: #f5a623;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .todo-input-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .todo-input {
      flex: 1;
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 12px 16px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    .todo-input::placeholder { color: #52525b; }
    .todo-input:focus { border-color: #3f3f46; }

    .btn-add {
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #ffffff;
      color: #000000;
      transition: background 0.2s;
    }
    .btn-add:hover { background-color: #e4e4e7; }
  </style>
</head>
<body>

  <!-- Main Clock Widget -->
  <div class="main-widget">
    <div class="ring-wrapper">
      <svg viewBox="0 0 130 130">
        <circle class="bg-circle" cx="65" cy="65" r="60" />
        <circle id="bar" class="progress-circle" cx="65" cy="65" r="60" />
      </svg>
      <div class="inner-text">
        <span id="pct" class="pct-number">0</span>
        <span id="phase" class="phase-label">MONDAY</span>
        <span id="time" class="time-label">12:00 PM</span>
      </div>
    </div>

    <div class="info-side">
      <div class="status-line">
        <span>⚡</span>
        <span id="status-text">Midday — keep moving</span>
      </div>
      <div id="awake-time" class="sub-line">10h 28m awake time left</div>
      <div class="alarm-chip">
        ⏰ <input type="time" id="alarm-time" value="08:00" onchange="updateAwakeTime()">
      </div>
    </div>
  </div>

  <!-- To Do List Section -->
  <div class="todo-section">
    <div class="todo-header">
      <div class="todo-title-group">
        <div id="today-date" class="todo-subtitle">TODAY — MON, AUG 17</div>
        <div class="todo-count"><span id="completed-count">0</span> <span>/ <span id="total-count">0</span> GOALS YET</span></div>
      </div>
      <div class="streak-badge">
        ⚡ <span id="streak-count">0 DAY STREAK</span>
      </div>
    </div>

    <div id="todo-list" class="todo-list">
      <!-- Tareas dinámicas -->
    </div>

    <div class="todo-input-row">
      <input type="text" id="todo-input" class="todo-input" placeholder="Add a goal for today..." onkeydown="if(event.key === 'Enter') addTodo()">
      <button class="btn-add" onclick="addTodo()">+ Add</button>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('heroes_todos') || '[]');
    let streakData = JSON.parse(localStorage.getItem('heroes_streak') || '{"count": 0, "lastDate": ""}');

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    }

    function checkStreak() {
      const today = getTodayString();
      const hasCompleted = todos.some(t => t.done);

      if (hasCompleted) {
        if (streakData.lastDate !== today) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          const yesterdayStr = `${yesterday.getFullYear()}-${yesterday.getMonth()+1}-${yesterday.getDate()}`;

          if (streakData.lastDate === yesterdayStr) {
            streakData.count += 1;
          } else {
            streakData.count = 1;
          }
          streakData.lastDate = today;
          localStorage.setItem('heroes_streak', JSON.stringify(streakData));
        }
      }
      document.getElementById('streak-count').innerText = `${streakData.count} DAY STREAK`;
    }

    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const totalSecondsToday = (hours * 3600) + (minutes * 60) + now.getSeconds();
      const pct = Math.floor((totalSecondsToday / 86400) * 100);

      const circ = 377;
      const offset = circ - (circ * pct / 100);
      document.getElementById('bar').style.strokeDashoffset = offset;
      document.getElementById('pct').innerText = pct;

      const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      
      document.getElementById('phase').innerText = days[now.getDay()];
      document.getElementById('today-date').innerText = `TODAY — ${days[now.getDay()].substring(0,3)}, ${months[now.getMonth()]} ${now.getDate()}`;

      let statusMsg = "Midday — keep moving";
      if (hours < 12) statusMsg = "Morning — win the day";
      else if (hours < 17) statusMsg = "Midday — keep moving";
      else if (hours < 21) statusMsg = "Afternoon — finish strong";
      else statusMsg = "Night — reset & rest";
      document.getElementById('status-text').innerText = statusMsg;

      let h12 = hours % 12 || 12;
      let ampm = hours >= 12 ? 'PM' : 'AM';
      let mStr = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('time').innerText = h12 + ':' + mStr + ' ' + ampm;

      updateAwakeTime();
    }

    function updateAwakeTime() {
      const now = new Date();
      const totalSecondsToday = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
      
      const alarmVal = document.getElementById('alarm-time').value || "08:00";
      let sleepHour = 23;
      let secondsLeft = (sleepHour * 3600) - totalSecondsToday;
      if (secondsLeft < 0) secondsLeft = 0;
      let hLeft = Math.floor(secondsLeft / 3600);
      let mLeft = Math.floor((secondsLeft % 3600) / 60);
      document.getElementById('awake-time').innerText = hLeft + 'h ' + mLeft + 'm awake time left';
    }

    function renderTodos() {
      const listContainer = document.getElementById('todo-list');
      listContainer.innerHTML = '';

      let completed = 0;
      todos.forEach((todo, index) => {
        if (todo.done) completed++;
        const item = document.createElement('div');
        item.className = `todo-item ${todo.done ? 'completed' : ''}`;
        item.innerHTML = `
          <span>${todo.text}</span>
          <input type="checkbox" ${todo.done ? 'checked' : ''} onchange="toggleTodo(${index})">
        `;
        listContainer.appendChild(item);
      });

      document.getElementById('completed-count').innerText = completed;
      document.getElementById('total-count').innerText = todos.length;
      localStorage.setItem('heroes_todos', JSON.stringify(todos));
      checkStreak();
    }

    function addTodo() {
      const input = document.getElementById('todo-input');
      const val = input.value.trim();
      if (val) {
        todos.push({ text: val, done: false });
        input.value = '';
        renderTodos();
      }
    }

    function toggleTodo(index) {
      todos[index].done = !todos[index].done;
      renderTodos();
    }

    updateClock();
    renderTodos();
    setInterval(updateClock, 10000);
  </script>
</body>
</html>
